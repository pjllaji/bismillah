<!DOCTYPE html>
<html lang="en">

<head>
    <title>Percabangan if</title>
</head>
<body>
    <script>
    
        function cekUmur() {
            let umur = document.getElementById("umur").value;
            let hasil = document.getElementById("hasil");

            if (umur >= 17) {
                hasil.innerHTML = "Anda sudah dewasa";
            } else {
                hasil.innerHTML = "Anda masih di bawah umur";
            }
        }   

    </script>
    <h1>Percabangan if</h1> 
    <label for="umur">Masukkan umur:</label>
    <input type="number" id="umur">
    <button onclick="cekUmur()">Cek Umur</button>
    <p id="hasil"></p>

</body>
</html>
