<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="tampilkan()" id="tombol">tampilkan</button>

    <div id="hasil"></div>
    <script>
        function tampilkan() {
            let teks = "hasil:<br>";

            for (let i = 1; i <= 100; i++) {
                teks += i + "<br>";
            }

            document.getElementById("hasil").innerHTML = teks;
        }
    </script>
</body>

</html>
